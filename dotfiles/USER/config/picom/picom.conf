backend = "glx"; 
shadow = false;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-exclude = [ "name = 'Notification'", "class_g = 'Conky'", "class_g ?= 'Notify-osd'", "class_g = 'Ca                                        iro-clock'", "_GTK_FRAME_EXTENTS@:c" ];
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
inactive-opacity = 0.8;
frame-opacity = 0.7;
inactive-opacity-override = false;
focus-exclude = [ "class_g = 'Cairo-clock'" ];
corner-radius = 0;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];
blur-kern = "3x3box";
log-level = "warn";
wintypes :
{
  tooltip :
  {
    fade = true;
    shadow = true;
    opacity = 0.75;
    focus = true;
    full-shadow = false;
  };
  dock :
  {
    shadow = false;
    clip-shadow-above = true;
  };
  dnd :
  {
    shadow = false;
  };
  popup_menu :
  {
    opacity = 0.8;
  };
  dropdown_menu :
  {
    opacity = 0.8;
  };
};
