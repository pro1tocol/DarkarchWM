[colors]
# Nordic Color Scheme
nord0 = #00000000
nord1 = #3b4252
nord2 = #434c5e
nord3 = #252525
nord4 = #6298e0
nord5 = #e5e9f0
nord6 = #eceff4
nord7 = #8fbcbb
nord8 = #88c0d0
nord9 = #6298e0
nord10 = #00000000
nord11 = #bf616a
nord12 = #d08770
nord13 = #ebcb8b
nord14 = #a3be8c
nord15 = #353535

[colors]
background = ${colors.nord0}
background-alt = ${colors.nord10}
foreground = ${colors.nord4}
primary = ${colors.nord15}
secondary = ${colors.nord1}
alert = ${colors.nord11}
disabled = ${colors.nord3}

[bar/main]
width = 100%
height = 18pt
font-0 = "MesloLGM Nerd Font;1"
line-size = 1pt
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
padding-left = 0
padding-right = 0
module-margin = 0
separator =
separator-foreground = ${colors.disabled}
modules-left = separator wired-network separator wireless-network separator xworkspaces
modules-center = date
modules-right = separator memory separator cpu separator backlight separator battery separator pulseaudio separator 
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/separator]
type = custom/text
format = <label>
format-foreground = ${colors.disabled}
format-padding = 1
label = |

[module/xworkspaces]
type = internal/xworkspaces
; Workspace labels
label-active = %name%
label-occupied = %name%
label-urgent = %name%
label-empty = %name%
; Active workspace
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-padding-left = 1
label-active-padding-right = 1
; Occupied workspace
label-occupied-padding-left = 1
label-occupied-padding-right = 1
; Urgent workspace
label-urgent-background = ${colors.alert}
label-urgent-padding-left = 1
label-urgent-padding-right = 1
; Empty workspace
label-empty-foreground = ${colors.disabled}
label-empty-padding-left = 1
label-empty-padding-right = 1
; Overall module settings
format = <label-state>
format-padding = 0

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
format-padding = 1
format-underline-size = 0.5
format-overline-size = 0.5

[module/wired-network]
type = internal/network
interface = eno1
interface-type = 🖧
interval = 5
accumulate-stats = true
unknown-as-up = true
label-connected-foreground = ${colors.nord9}
label-disconnected = ⚠
label-disconnected-foreground = ${colors.disabled}

[module/wireless-network]
type = internal/network
interface = wlan0
interface-type = 🖧
interval = 5
accumulate-stats = true
unknown-as-up = true
label-connected-foreground = ${colors.nord9}
label-disconnected = ⚠
label-disconnected-foreground = ${colors.disabled}

[module/date]
type = internal/date
interval = 1
format-prefix = " "
format-prefix-foreground = ${colors.nord9}
; date = "%I:%M %p"
date = "%T"
date-alt = %Y-%m-%d %I:%M:%S %p
label = %date%
format-padding = 1

[module/memory]
type = internal/memory
interval = 5
format-prefix = " "
format-prefix-foreground = ${colors.nord9}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 5
format-prefix = " "
format-prefix-foreground = ${colors.nord9}
label = %percentage:2%%

[module/battery]
type = internal/battery
format-prefix = " "
format-full-prefix = " "
format-full-prefix-foreground = ${colors.nord9}
format-prefix-foreground = ${colors.primary}
full-at = 80
format-charging = <animation-charging> <label-charging>
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
; framerate in milliseconds
animation-charging-framerate = 750
animation-charging-foreground = ${colors.nord12}
format-discharging = <ramp-capacity> <label-discharging>
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
low-at = 5
battery = BAT1
adapter = acad
poll-interval = 5

[module/backlight]
type = internal/backlight
card = amdgpu_bl1
use-actual-brightness = true
poll-interval = 0
enable-scroll = true
scroll-interval = 10
format = <label>
format-prefix = "󰛨 "
format-prefix-foreground = ${colors.nord9}
label = %percentage%%

[module/pulseaudio]
type = internal/pulseaudio
format-name = volume
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.nord9}
label-volume = %percentage%%
label-muted = "-"
label-muted-foreground = ${colors.disabled}
format-volume-padding = 1
format-muted-padding = 1

[module/tray]
type = internal/tray
format-padding = 1
tray-spacing = 10px
tray-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true
